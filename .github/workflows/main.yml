name: execute testcases
on :
  push:
    branches:
    - main
jobs:
  Build_test_cases:
    runs-on : ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: install python required library
        run: pip install -r requirements.txt
      
      - name: run test case
        run : pytest --cov=calc --cov-report-term

      
  deploy:
    runs-on : ubuntu-latest
    steps:
      - name: print message
        run: echo "sucessfully deployed"



          
    
