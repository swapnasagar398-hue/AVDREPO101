name: python version workflow
on :
    push:
        branches:
        - main
jobs:
    job1:
        runs-on : ubuntu-latest
        steps:
        - name: show python version
          run: python --version
        - name: print python version
          run:  echo "show latest version"
        - name: setup python version 3.10
          uses: actions/setup-python@v3
          with:
            python --version : '3.10'
        - name: show python version
          run: python --version
          
    
